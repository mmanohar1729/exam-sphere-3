<!DOCTYPE html>
<html>
<head>
<title>Exam Sphere - Workspace</title>

<style>
body {
  font-family: Arial;
  background: #eef3fa;
  margin: 0;
}
header {
  background: #123b70;
  color: white;
  padding: 20px;
  text-align: center;
}
.container {
  max-width: 850px;
  margin: 30px auto;
  padding: 20px;
  background: white;
  border-radius: 12px;
}
input, textarea {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  box-sizing: border-box;
  border: 1px solid #bbb;
  border-radius: 5px;
}
textarea {
  height: 300px;
  background: #172033;
  color: white;
  font-family: monospace;
  font-size: 15px;
}
button {
  padding: 12px 20px;
  border: none;
  background: #1769aa;
  color: white;
  border-radius: 5px;
  cursor: pointer;
  margin: 5px;
}
.output {
  background: #172033;
  color: #70e69a;
  padding: 15px;
  min-height: 80px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<header>
<h1>EXAM SPHERE</h1>
<p>Student and Java Coding Workspace</p>
</header>

<div class="container">

<button onclick="location.href='index.html'">
← Back to Home
</button>

<!-- STUDENT DETAILS -->

<div id="studentPage" hidden>

<h2>Student Details</h2>

<form id="studentForm">

<label>Student ID</label>
<input type="text" id="sid" required>

<label>Student Name</label>
<input type="text" id="sname" required>

<label>Branch</label>
<input type="text" id="branch" required>

<label>Year</label>
<input type="text" id="year" required>

<button type="submit">Save Details</button>

</form>

<p id="studentMessage"></p>

</div>

<!-- JAVA MODULE -->

<div id="modulePage" hidden>

<h2 id="moduleTitle"></h2>

<p>Write your own Java code below.</p>

<textarea id="code"
placeholder="Write your Java code here...

Example:
public class Main {
    public static void main(String[] args) {

    }
}"></textarea>

<button onclick="runJava()">Run Code</button>

<button onclick="checkJava()">Check Code</button>

<h3>Output</h3>

<div class="output" id="output">
Your Java output will appear here.
</div>

</div>

</div>

<script>

const params = new URLSearchParams(
  window.location.search
);

const module = params.get("module");
const mode = params.get("mode");

if (mode === "student") {

  document.getElementById("studentPage")
    .hidden = false;

} else if (
  ["student", "adaptive", "result"].includes(module)
) {

  document.getElementById("modulePage")
    .hidden = false;

  const titles = {
    student: "1. Student Module - Java Code",
    adaptive: "2. Adaptive Module - Java Code",
    result: "3. Result Module - Java Code"
  };

  document.getElementById("moduleTitle")
    .innerText = titles[module];

} else {
  document.getElementById("moduleTitle")
    .innerText = "Select a valid module";
}

// Save student details

document.getElementById("studentForm")
.addEventListener("submit", function(e) {

  e.preventDefault();

  const student = {
    id: document.getElementById("sid").value,
    name: document.getElementById("sname").value,
    branch: document.getElementById("branch").value,
    year: document.getElementById("year").value
  };

  localStorage.setItem(
    "examSphereStudent",
    JSON.stringify(student)
  );

  document.getElementById("studentMessage")
    .innerText = "Student details saved successfully!";

});

// Run Java code

async function runJava() {

  const code = document.getElementById("code").value;
  const output = document.getElementById("output");

  if (!code.trim()) {
    output.innerText = "Please write Java code first.";
    return;
  }

  output.innerText = "Running Java code...";

  try {

    const response = await fetch(
      "https://emkc.org/api/v2/piston/execute",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          language: "java",
          version: "15.0.2",
          files: [
            {
              name: "Main.java",
              content: code
            }
          ]
        })
      }
    );

    if (!response.ok) {
      throw new Error("Compiler service unavailable.");
    }

    const result = await response.json();

    output.innerText =
      result.run.stdout ||
      result.run.stderr ||
      "No output produced.";

    if (result.compile && result.compile.stderr) {
      output.innerText =
        "Compilation Error:\n" +
        result.compile.stderr;
    }

  } catch (error) {
    output.innerText =
      "Unable to run code: " + error.message;
  }
}

// Check Java code

function checkJava() {
  const code = document.getElementById("code").value;

  if (!code.trim()) {
    document.getElementById("output").innerText =
      "Please write Java code before checking.";
    return;
  }

  runJava();
}

</script>

</body>
</html>
